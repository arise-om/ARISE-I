[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arise-i"
dynamic = ["version"]
description = "Autonomous File Organization Unit — sorts Downloads and any folder automatically"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Om", email = "om@ironlabs.tech" }]
requires-python = ">=3.10"
keywords = ["file-organizer", "automation", "downloads", "sorting", "daemon"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment :: File Managers",
    "Topic :: Utilities",
]
dependencies = [
    "PyYAML>=6.0",
    "watchdog>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pyinstaller>=6.0",
    "ruff>=0.5",
]
ai = [
    "scikit-learn>=1.3",
    "filetype>=1.2",
]

[project.scripts]
# After `pip install -e .` these commands become available system-wide:
arise-i     = "arise_i.core.organizer:_cli_main"
arise-i-gui = "arise_i.gui.app:main"

[project.urls]
Homepage   = "https://github.com/arise-om/ARISE-I"
Repository = "https://github.com/arise-om/ARISE-I"
Issues     = "https://github.com/arise-om/ARISE-I/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v"

[tool.setuptools.dynamic]
version = { attr = "arise_i.__version__" }

[tool.setuptools.packages.find]
include = ["arise_i*"]

[tool.ruff]
target-version = "py310"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
# E701/E702: the GUI deliberately uses compact one-line guards.
# B905: zip(strict=) is noise for the equal-length pairs used here.
ignore = ["E501", "E701", "E702", "B905"]
