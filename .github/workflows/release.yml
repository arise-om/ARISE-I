name: Build desktop apps

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            artifact: ARISE-I-Setup-Windows
          - os: macos-latest
            name: macOS
            artifact: ARISE-I-macOS
          - os: ubuntu-latest
            name: Linux
            artifact: ARISE-I-Linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Install the package with its AI extras so the release builds ship the
      # same ML and byte-level MIME layers the README describes.
      - name: Install ARISE-I and build tools
        run: |
          python -m pip install --upgrade pip
          pip install ".[ai]" "pyinstaller>=6.0"
      - name: Build standalone app
        run: pyinstaller --noconfirm --clean packaging/arise-i.spec
      - name: Smoke-test the build
        if: runner.os != 'macOS'
        shell: bash
        run: |
          exe=dist/ARISE-I/ARISE-I
          [ "$RUNNER_OS" = "Windows" ] && exe="$exe.exe"
          "$exe" --self-test
      - name: Smoke-test the build (macOS)
        if: runner.os == 'macOS'
        run: dist/ARISE-I.app/Contents/MacOS/ARISE-I --self-test
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress --yes
          $version = "${{ github.ref_name }}" -replace '^v', ''
          if ($version -notmatch '^\d') { $version = (Select-String -Path arise_i/__init__.py -Pattern '^__version__ = "(.+)"').Matches[0].Groups[1].Value }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging/ARISE-I.iss
      - name: Create macOS zip
        if: runner.os == 'macOS'
        run: |
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent dist/ARISE-I.app release/ARISE-I-macOS.zip
      - name: Create Linux archive
        if: runner.os == 'Linux'
        run: |
          mkdir -p release
          tar -C dist -czf release/ARISE-I-Linux.tar.gz ARISE-I
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
